# Codecov configuration.
#
# The project target is 75%, which CI enforces directly with
# `cargo tarpaulin --fail-under 75`. Codecov is configured as the second, independent view:
# it tracks the trend and comments on pull requests, but it is not the gate. Two things
# enforce the same number in different places, and when they disagree the CI step is
# authoritative because it runs on the code rather than on an upload.
#
# Measured coverage is well above the target — 89.42% of lines across the four contracts —
# so the threshold is not the binding constraint. It is set at 75 rather than at 89 for a
# deliberate reason: a target equal to today's number means every pull request that adds a
# hard-to-test error path fails, which pushes people toward writing tests for the coverage
# report instead of for the behaviour. The floor should stop a real regression, not punish
# ordinary work.
coverage:
  precision: 2
  round: down
  range: "70...95"

  status:
    # The overall figure may drift down by up to 1% without failing, which absorbs the
    # rounding noise of a small change while still catching a genuine slide.
    project:
      default:
        target: 75%
        threshold: 1%
        if_ci_failed: error

    # A change that adds a large amount of untested code fails even when the project total
    # stays above target, which is the case the project-level check alone cannot catch: a
    # big enough corpus keeps the average up while the new code goes uncovered.
    patch:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error

# Files whose coverage is not meaningful.
ignore:
  # Fuzz harnesses are entry points into the contracts, not code under test. They are
  # compiled and checked in CI, but a fuzz target has no assertions to cover.
  - "contracts/fuzz/**"
  # Integration tests exercise the contracts rather than being covered by them.
  - "contracts/tests/**"
  # Generated by the toolchain and by the deploy script.
  - "contracts/target/**"
  - "scripts/deployments/**"
  - "**/*.d.ts"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  contracts:
    paths:
      - contracts/
    carryforward: true

name: ZizaLend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per workflow per ref. Pushing three times in a minute used to start three full CI
  # runs of which only the last mattered, and the two dead runs held runners and left the pull
  # request showing a mixture of stale and current check results.
  #
  # Never cancel on the default branch: a cancelled run there reports no result for the jobs it
  # was holding, and a required check that never reports blocks the merge it was protecting.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  supply-chain-audit:
    # Observed ~6s. The step is a few greps over four lockfiles.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block compromised packages
        run: |
          echo "Scanning lockfiles for known malicious packages..."
          BLOCKED="plain-crypto-js"
          for lockfile in backend/package-lock.json frontend/package-lock.json scripts/package-lock.json; do
            if [ -f "$lockfile" ] && grep -q "$BLOCKED" "$lockfile"; then
              echo "::error::SUPPLY CHAIN ALERT: $lockfile contains $BLOCKED (confirmed malware)"
              exit 1
            fi
          done
          LOCKFILES="backend/package-lock.json frontend/package-lock.json scripts/package-lock.json package-lock.json"
          if grep '"axios": "1\.14\.' $LOCKFILES; then
            echo "::error::SUPPLY CHAIN ALERT: axios 1.14.x detected (compromised version)"
            exit 1
          fi
          echo "No known malicious packages found."

  backend:
    needs: supply-chain-audit
    # Observed ~84s across install, the Postgres/Redis services, migrations and 598 tests.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: ZizaLend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: Build
        run: npm run build
        working-directory: backend
      - name: Type check
        run: npm run typecheck
        working-directory: backend
      - name: Run migrations
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret
          STELLAR_RPC_URL: https://rpc.test.invalid
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          LOAN_MANAGER_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          LENDING_POOL_CONTRACT_ID: CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          REMITTANCE_NFT_CONTRACT_ID: CDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD
          MULTISIG_GOVERNANCE_CONTRACT_ID: CEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
          POOL_TOKEN_ADDRESS: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
          LOAN_MANAGER_ADMIN_SECRET: test_admin_secret
          INTERNAL_API_KEY: test_internal_api_key
          FRONTEND_URL: https://frontend.example.com

  migration-paths:
    # Observed ~7s. Only lists changed paths; it never installs anything.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'backend/migrations/**'
              - 'backend/package.json'

  migration-check:
    needs: [supply-chain-audit, migration-paths]
    if: github.event_name == 'push' || needs.migration-paths.outputs.migrations == 'true'
    # Observed ~45s: migrate up, roll every migration back one at a time, then migrate up again.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: ZizaLend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Migrate up from empty schema
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Migrate all the way down (reversibility check)
        run: |
          # Count migrations and roll them all back one by one
          MIGRATION_COUNT=$(ls migrations/*.js 2>/dev/null | wc -l)
          for i in $(seq 1 "$MIGRATION_COUNT"); do
            npm run migrate:down -- --count 1
          done
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Migrate up again (ordering + idempotency check)
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test

  frontend:
    needs: supply-chain-audit
    # Observed ~81s: install, lint, typecheck, unit tests and a full `next build`.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
        env:
          NODE_ENV: test
      - name: Build
        run: npm run build
        working-directory: frontend

  scripts-typecheck:
    needs: supply-chain-audit
    # Observed ~13s. Typecheck only.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Type check deploy scripts
        run: npm run typecheck
        working-directory: scripts

  packages:
    needs: supply-chain-audit
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install types dependencies
        run: npm install
        working-directory: packages/types

      - name: Generate types from OpenAPI
        run: npm run generate
        working-directory: packages/types

      - name: Type check types package
        run: npm run typecheck
        working-directory: packages/types

      - name: Build types package
        run: npm run build
        working-directory: packages/types

      - name: Install SDK dependencies
        run: npm install
        working-directory: packages/sdk

      - name: Type check SDK
        run: npm run typecheck
        working-directory: packages/sdk

      - name: Build SDK
        run: npm run build
        working-directory: packages/sdk

  backend-format:
    needs: supply-chain-audit
    # Observed ~19s. Raised from 3 minutes so the value sits above the observed duration
    # rather than a hair below it.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Check Prettier formatting
        run: npm run format:check
        working-directory: backend

  shell-check:
    # Observed ~6s. `bash -n` over every script.
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' \
            -exec bash -n {} \;
          echo "All shell scripts pass syntax check."

  conflict-check:
    # Observed ~5s. One recursive grep.
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unresolved merge conflict markers
        run: |
          if grep -rE '^(<<<<<<<|=======|>>>>>>>)' \
            --include='*.ts' --include='*.tsx' --include='*.rs' \
            --include='*.js' --include='*.md' --include='*.json' . ; then
            echo "::error::Unresolved merge conflict markers found in the codebase"
            exit 1
          fi
          echo "No merge conflict markers found."

  openapi-check:
    needs: supply-chain-audit
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate OpenAPI spec is well-formed JSON
        run: |
          node -e "
            const fs = require('fs');
            const spec = JSON.parse(fs.readFileSync('packages/openapi.json', 'utf8'));
            if (!spec.openapi) {
              console.error('Missing openapi version field');
              process.exit(1);
            }
            if (!spec.info || !spec.info.title) {
              console.error('Missing info.title field');
              process.exit(1);
            }
            console.log('OpenAPI spec is valid (' + spec.openapi + '): ' + spec.info.title);
          "

  # `github.event.pull_request.changed_files` is a count on the REST API response, not a field
  # of the pull request webhook payload, so the condition the `e2e` job used to carry evaluated
  # against nothing and skipped end-to-end tests on every pull request that touched the frontend.
  # A path filter is the supported way to ask "did this change touch the frontend?", and is the
  # same shape `migration-paths` already uses.
  frontend-paths:
    # Observed ~5s. Lists changed paths; it never installs anything.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  e2e:
    needs: [supply-chain-audit, frontend, frontend-paths]
    # Observed ~75s: install, the chromium browser download, then the chromium project.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Pushes to the default branch always run this; a pull request only when it touches the
    # frontend. The filter result is empty for non-pull-request events, hence the guard.
    if: github.event_name == 'push' || needs.frontend-paths.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run e2e tests
        run: npx playwright test --project=chromium
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  env-docs-check:
    # Observed ~8s. Node-only, no install step.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check env docs are in sync
        run: node scripts/check-env-docs.mjs

  issue-backlog:
    # The backlog is reviewed like code, so a malformed draft has to fail here rather
    # than at publish time. `--validate-only` parses every draft and refuses a missing
    # frontmatter field, a duplicate backlog id, and a duplicate title. It needs no
    # token, because it never talks to the API.
    runs-on: ubuntu-latest
    # Observed ~7s. Raised from 3 minutes so the value sits above the observed duration.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate the issue backlog
        run: node scripts/publish-issues.mjs --validate-only
      - name: Confirm the backlog index is current
        run: node scripts/publish-issues.mjs --validate-only --check-index

  contracts:
    # Observed ~345s: fmt, clippy over all targets, the unit tests, a release wasm build,
    # the size budgets and a coverage run. This is the one job that genuinely needs a
    # generous budget, so it gets one with room for a cold dependency cache.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
     
      # Pinned to the toolchain contracts/rust-toolchain.toml declares, rather than
      # `stable`. That file makes rustup resolve the compiler for anything run under
      # contracts/, so installing `stable` here tested a toolchain the repository does not
      # use and left the real one to be fetched mid-run.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            contracts/fuzz
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: contracts
      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: contracts
      - name: Run unit tests
        run: cargo test -- --test-threads=1
        working-directory: contracts
      - name: Build WASM contracts
        run: cargo build --workspace --target wasm32v1-none --release --exclude zizalend-integration-tests
        working-directory: contracts

      # Per-contract budgets, with the reasoning for each recorded beside it. This replaced a
      # flat 256 KiB placeholder that every contract cleared with ~60% to spare, so it could not
      # fail and therefore enforced nothing.
      - name: Check WASM size budgets
        run: node scripts/check-wasm-size.mjs
      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: contracts/target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
      - name: Install tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      # `--fail-under 75` is what makes this a check rather than a report. Coverage was already
      # being measured and uploaded as an artifact, which means nothing could ever fail because
      # of it — a number nobody is held to is a number that drifts. Measured with the same tool
      # and the same invocation used here, so the threshold is one the suite actually clears
      # rather than a target chosen to look ambitious.
      - name: Run coverage
        run: cargo tarpaulin --out Xml --fail-under 75
        working-directory: contracts
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: contracts/cobertura.xml
          flags: contracts
          fail_ci_if_error: false
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage
          path: contracts/cobertura.xml
          retention-days: 7
      - name: Check fuzz targets compile
        run: cargo check
        working-directory: contracts/fuzz

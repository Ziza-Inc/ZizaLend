name: ZizaLend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  supply-chain-audit:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block compromised packages
        run: |
          echo "Scanning lockfiles for known malicious packages..."
          BLOCKED="plain-crypto-js"
          for lockfile in backend/package-lock.json frontend/package-lock.json scripts/package-lock.json; do
            if [ -f "$lockfile" ] && grep -q "$BLOCKED" "$lockfile"; then
              echo "::error::SUPPLY CHAIN ALERT: $lockfile contains $BLOCKED (confirmed malware)"
              exit 1
            fi
          done
          LOCKFILES="backend/package-lock.json frontend/package-lock.json scripts/package-lock.json package-lock.json"
          if grep '"axios": "1\.14\.' $LOCKFILES; then
            echo "::error::SUPPLY CHAIN ALERT: axios 1.14.x detected (compromised version)"
            exit 1
          fi
          echo "No known malicious packages found."

  backend:
    needs: supply-chain-audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: ZizaLend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: Build
        run: npm run build
        working-directory: backend
      - name: Type check
        run: npm run typecheck
        working-directory: backend
      - name: Run migrations
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret
          STELLAR_RPC_URL: https://rpc.test.invalid
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          LOAN_MANAGER_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          LENDING_POOL_CONTRACT_ID: CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          REMITTANCE_NFT_CONTRACT_ID: CDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD
          MULTISIG_GOVERNANCE_CONTRACT_ID: CEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
          POOL_TOKEN_ADDRESS: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
          LOAN_MANAGER_ADMIN_SECRET: test_admin_secret
          INTERNAL_API_KEY: test_internal_api_key
          FRONTEND_URL: https://frontend.example.com

  migration-paths:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'backend/migrations/**'
              - 'backend/package.json'

  migration-check:
    needs: [supply-chain-audit, migration-paths]
    if: github.event_name == 'push' || needs.migration-paths.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: ZizaLend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Migrate up from empty schema
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Migrate all the way down (reversibility check)
        run: |
          # Count migrations and roll them all back one by one
          MIGRATION_COUNT=$(ls migrations/*.js 2>/dev/null | wc -l)
          for i in $(seq 1 "$MIGRATION_COUNT"); do
            npm run migrate:down -- --count 1
          done
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Migrate up again (ordering + idempotency check)
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test

  frontend:
    needs: supply-chain-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
        env:
          NODE_ENV: test
      - name: Build
        run: npm run build
        working-directory: frontend

  scripts-typecheck:
    needs: supply-chain-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Type check deploy scripts
        run: npm run typecheck
        working-directory: scripts

  packages:
    needs: supply-chain-audit
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install types dependencies
        run: npm install
        working-directory: packages/types

      - name: Generate types from OpenAPI
        run: npm run generate
        working-directory: packages/types

      - name: Type check types package
        run: npm run typecheck
        working-directory: packages/types

      - name: Build types package
        run: npm run build
        working-directory: packages/types

      - name: Install SDK dependencies
        run: npm install
        working-directory: packages/sdk

      - name: Type check SDK
        run: npm run typecheck
        working-directory: packages/sdk

      - name: Build SDK
        run: npm run build
        working-directory: packages/sdk

  backend-format:
    needs: supply-chain-audit
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Check Prettier formatting
        run: npm run format:check
        working-directory: backend

  shell-check:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' \
            -exec bash -n {} \;
          echo "All shell scripts pass syntax check."

  conflict-check:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unresolved merge conflict markers
        run: |
          if grep -rE '^(<<<<<<<|=======|>>>>>>>)' \
            --include='*.ts' --include='*.tsx' --include='*.rs' \
            --include='*.js' --include='*.md' --include='*.json' . ; then
            echo "::error::Unresolved merge conflict markers found in the codebase"
            exit 1
          fi
          echo "No merge conflict markers found."

  openapi-check:
    needs: supply-chain-audit
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenAPI spec is well-formed JSON
        run: |
          node -e "
            const fs = require('fs');
            const spec = JSON.parse(fs.readFileSync('packages/openapi.json', 'utf8'));
            if (!spec.openapi) {
              console.error('Missing openapi version field');
              process.exit(1);
            }
            if (!spec.info || !spec.info.title) {
              console.error('Missing info.title field');
              process.exit(1);
            }
            console.log('OpenAPI spec is valid (' + spec.openapi + '): ' + spec.info.title);
          "

  e2e:
    needs: [supply-chain-audit, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files, 'frontend/')
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run e2e tests
        run: npx playwright test --project=chromium
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  env-docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check env docs are in sync
        run: node scripts/check-env-docs.mjs

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
     
      # Pinned to the toolchain contracts/rust-toolchain.toml declares, rather than
      # `stable`. That file makes rustup resolve the compiler for anything run under
      # contracts/, so installing `stable` here tested a toolchain the repository does not
      # use and left the real one to be fetched mid-run.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            contracts/fuzz
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: contracts
      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: contracts
      - name: Run unit tests
        run: cargo test -- --test-threads=1
        working-directory: contracts
      - name: Build WASM contracts
        run: |
          set -euo pipefail

          cargo build --workspace --target wasm32-unknown-unknown --release --exclude zizalend-integration-tests

          # Generous initial budget: 256 KiB per contract. Tighten after baseline optimization.
          max_bytes=$((256 * 1024))
          shopt -s nullglob
          wasm_files=(target/wasm32-unknown-unknown/release/*.wasm)

          if [ "${#wasm_files[@]}" -eq 0 ]; then
            echo "::error::No wasm artifacts were produced."
            exit 1
          fi

          for wasm in "${wasm_files[@]}"; do
            size_bytes=$(stat -c%s "$wasm")
            size_kib=$(( (size_bytes + 1023) / 1024 ))
            echo "$(basename "$wasm"): ${size_bytes} bytes (${size_kib} KiB), budget ${max_bytes} bytes"

            if [ "$size_bytes" -gt "$max_bytes" ]; then
              echo "::error file=$wasm::WASM artifact exceeds the 256 KiB per-contract budget."
              exit 1
            fi
          done
        working-directory: contracts
      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
      - name: Install tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --out Xml
        working-directory: contracts
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage
          path: contracts/cobertura.xml
          retention-days: 7
      - name: Check fuzz targets compile
        run: cargo check
        working-directory: contracts/fuzz

name: ZizaLend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per workflow per ref. Pushing three times in a minute used to start three full CI
  # runs of which only the last mattered, and the two dead runs held runners and left the pull
  # request showing a mixture of stale and current check results.
  #
  # Never cancel on the default branch: a cancelled run there reports no result for the jobs it
  # was holding, and a required check that never reports blocks the merge it was protecting.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  supply-chain-audit:
    # Observed ~7s. A few greps over every lockfile, plus a policy check that reads no network.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block compromised packages
        # The lockfile list is discovered rather than written out. A hardcoded list is how
        # `scripts/video/package-lock.json` went unscanned while the step still reported a clean
        # bill of health: the list named four lockfiles, and there are five npm ones.
        run: |
          echo "Scanning lockfiles for known malicious packages..."

          mapfile -t LOCKFILES < <(git ls-files | grep -E '(^|/)(package-lock\.json|npm-shrinkwrap\.json|Cargo\.lock)$')
          printf '  watching %d lockfile(s)\n' "${#LOCKFILES[@]}"
          printf '    %s\n' "${LOCKFILES[@]}"

          BLOCKED="plain-crypto-js"
          for lockfile in "${LOCKFILES[@]}"; do
            if grep -q "$BLOCKED" "$lockfile"; then
              echo "::error::SUPPLY CHAIN ALERT: $lockfile contains $BLOCKED (confirmed malware)"
              exit 1
            fi
          done

          if grep '"axios": "1\.14\.' "${LOCKFILES[@]}"; then
            echo "::error::SUPPLY CHAIN ALERT: axios 1.14.x detected (compromised version)"
            exit 1
          fi
          echo "No known malicious packages found."
      - name: Check dependency review scope and licence policy
        run: node scripts/check-dependency-review-scope.mjs

  backend:
    needs: supply-chain-audit
    # Observed ~84s across install, the Postgres/Redis services, migrations and 598 tests.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: ZizaLend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: Build
        run: npm run build
        working-directory: backend
      - name: Type check
        run: npm run typecheck
        working-directory: backend
      - name: Run migrations
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret
          STELLAR_RPC_URL: https://rpc.test.invalid
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          LOAN_MANAGER_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          LENDING_POOL_CONTRACT_ID: CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          REMITTANCE_NFT_CONTRACT_ID: CDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD
          MULTISIG_GOVERNANCE_CONTRACT_ID: CEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
          POOL_TOKEN_ADDRESS: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
          LOAN_MANAGER_ADMIN_SECRET: test_admin_secret
          INTERNAL_API_KEY: test_internal_api_key
          FRONTEND_URL: https://frontend.example.com

  migration-paths:
    # Observed ~7s. Only lists changed paths; it never installs anything.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'backend/migrations/**'
              - 'backend/package.json'

  migration-check:
    needs: [supply-chain-audit, migration-paths]
    if: github.event_name == 'push' || needs.migration-paths.outputs.migrations == 'true'
    # Observed ~45s: migrate up, roll every migration back one at a time, then migrate up again.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: ZizaLend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Check migration timestamps are unique
        # Runs before anything is installed or migrated: it is a pure filename check, and
        # a collision makes the order of the migrations below depend on the alphabet
        # rather than on the timestamp.
        run: node scripts/check-migration-timestamps.mjs
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Migrate up from empty schema
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Migrate all the way down (reversibility check)
        run: |
          # Count migrations and roll them all back one by one
          MIGRATION_COUNT=$(ls migrations/*.js 2>/dev/null | wc -l)
          for i in $(seq 1 "$MIGRATION_COUNT"); do
            npm run migrate:down -- --count 1
          done
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test
      - name: Migrate up again (ordering + idempotency check)
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test

      # Renaming a migration that a database has already applied is the one case an
      # empty-schema run cannot cover, so it is simulated here. The recorded names are put
      # back the way a deployed database has them, the order guard is shown to actually
      # refuse, and the reconciliation step is then shown to repair it.
      - name: Simulate a database that ran the pre-rename filenames
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE pgmigrations
             SET name = '1777000000007_unique-loan-status-events'
           WHERE name = '1777000000008_unique-loan-status-events';
          UPDATE pgmigrations
             SET name = '1778000000008_transaction-submissions'
           WHERE name = '1778000000009_transaction-submissions';
          UPDATE pgmigrations
             SET name = '1786000000016_webhook-max-attempts'
           WHERE name = '1786000000017_webhook-max-attempts';
          UPDATE pgmigrations
             SET name = '1788000000018_unified-contract-events'
           WHERE name = '1788000000019_unified-contract-events';
          SQL
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test

      - name: Confirm the order guard refuses before reconciliation
        run: |
          # Asserted rather than assumed: if the guard did not fire, the reconciliation
          # step below would look necessary when it was not, and a regression in the guard
          # would go unnoticed.
          if npm run migrate:up; then
            echo "::error::expected node-pg-migrate to refuse a renamed migration, but it succeeded"
            exit 1
          fi
          echo "node-pg-migrate refused the renamed migration, as expected."
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test

      - name: Reconcile renamed migrations
        run: npm run migrate:reconcile
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test

      - name: Migrate up after reconciliation (must now succeed)
        run: npm run migrate:up
        working-directory: backend
        env:
          DATABASE_URL: postgres://pguser:pgpass@localhost:5432/ZizaLend_test

  frontend:
    needs: supply-chain-audit
    # Observed ~81s: install, lint, typecheck, unit tests and a full `next build`.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Translation keys
        run: npm run i18n:check
        working-directory: frontend
      - name: Verify the i18n check fails on a missing key
        # A check that never fails is indistinguishable from a green step that reads nothing.
        # Run it against a copy of the locales with one key removed and require a non-zero exit
        # that names the key, so a broken matcher is caught here rather than in production.
        run: |
          scratch="$(mktemp -d)"
          cp messages/*.json "$scratch/"
          node -e "
            const fs = require('fs');
            const file = process.argv[1] + '/es.json';
            const messages = JSON.parse(fs.readFileSync(file, 'utf8'));
            delete messages.HomePage.title;
            fs.writeFileSync(file, JSON.stringify(messages, null, 2));
          " "$scratch"

          if output="$(node scripts/check-i18n.mjs --messages-dir "$scratch" 2>&1)"; then
            echo "The i18n check passed a locale with a missing key." >&2
            echo "$output" >&2
            exit 1
          fi

          if ! echo "$output" | grep -q "HomePage.title"; then
            echo "The i18n check failed but did not name the missing key." >&2
            echo "$output" >&2
            exit 1
          fi

          rm -rf "$scratch"
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
        env:
          NODE_ENV: test
      - name: Build
        run: npm run build
        working-directory: frontend

  scripts-typecheck:
    needs: supply-chain-audit
    # Observed ~13s. Typecheck only.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Type check deploy scripts
        run: npm run typecheck
        working-directory: scripts

      # Repo-wide policy checks that need only a checkout and node. Node is on the runner; none
      # of these scripts have dependencies of their own.
      #
      # The quarantine ledger spans backend, frontend and contracts, so it cannot live in a job
      # scoped to one workspace, and its whole value is that it fails on a pull request.
      - name: Enforce the quarantine policy
        run: node scripts/check-quarantine.mjs
        working-directory: .

  packages:
    needs: supply-chain-audit
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install types dependencies
        run: npm install
        working-directory: packages/types

      - name: Generate types from OpenAPI
        run: npm run generate
        working-directory: packages/types

      - name: Type check types package
        run: npm run typecheck
        working-directory: packages/types

      - name: Build types package
        run: npm run build
        working-directory: packages/types

      - name: Install SDK dependencies
        run: npm install
        working-directory: packages/sdk

      - name: Check the SDK error-code union is current
        # The SDK derives its error-code union from `backend/src/errors/errorCodes.ts`. This
        # fails when a code is added or removed without regenerating, which is the only thing
        # keeping the two from disagreeing about what a code is called.
        run: node scripts/generate-sdk-error-codes.mjs --check

      - name: Type check SDK
        run: npm run typecheck
        working-directory: packages/sdk

      - name: Build SDK
        run: npm run build
        working-directory: packages/sdk

  backend-format:
    needs: supply-chain-audit
    # Observed ~19s. Raised from 3 minutes so the value sits above the observed duration
    # rather than a hair below it.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Check Prettier formatting
        run: npm run format:check
        working-directory: backend

  shell-check:
    # Observed ~6s. `bash -n` over every script.
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' \
            -exec bash -n {} \;
          echo "All shell scripts pass syntax check."

  conflict-check:
    # Observed ~5s. One recursive grep.
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unresolved merge conflict markers
        run: |
          if grep -rE '^(<<<<<<<|=======|>>>>>>>)' \
            --include='*.ts' --include='*.tsx' --include='*.rs' \
            --include='*.js' --include='*.md' --include='*.json' . ; then
            echo "::error::Unresolved merge conflict markers found in the codebase"
            exit 1
          fi
          echo "No merge conflict markers found."

  openapi-check:
    needs: supply-chain-audit
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate OpenAPI spec is well-formed JSON
        run: |
          node -e "
            const fs = require('fs');
            const spec = JSON.parse(fs.readFileSync('packages/openapi.json', 'utf8'));
            if (!spec.openapi) {
              console.error('Missing openapi version field');
              process.exit(1);
            }
            if (!spec.info || !spec.info.title) {
              console.error('Missing info.title field');
              process.exit(1);
            }
            console.log('OpenAPI spec is valid (' + spec.openapi + '): ' + spec.info.title);
          "

  # `github.event.pull_request.changed_files` is a count on the REST API response, not a field
  # of the pull request webhook payload, so the condition the `e2e` job used to carry evaluated
  # against nothing and skipped end-to-end tests on every pull request that touched the frontend.
  # A path filter is the supported way to ask "did this change touch the frontend?", and is the
  # same shape `migration-paths` already uses.
  frontend-paths:
    # Observed ~5s. Lists changed paths; it never installs anything.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  e2e:
    needs: [supply-chain-audit, frontend, frontend-paths]
    # Observed ~75s: install, the chromium browser download, then the chromium project.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Pushes to the default branch always run this; a pull request only when it touches the
    # frontend. The filter result is empty for non-pull-request events, hence the guard.
    if: github.event_name == 'push' || needs.frontend-paths.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run e2e tests
        run: npx playwright test --project=chromium
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  env-docs-check:
    # Observed ~8s. Node-only, no install step.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check env docs are in sync
        run: node scripts/check-env-docs.mjs

  issue-backlog:
    # The backlog is reviewed like code, so a malformed draft has to fail here rather
    # than at publish time. `--validate-only` parses every draft and refuses a missing
    # frontmatter field, a duplicate backlog id, and a duplicate title. It needs no
    # token, because it never talks to the API.
    runs-on: ubuntu-latest
    # Observed ~7s. Raised from 3 minutes so the value sits above the observed duration.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate the issue backlog
        run: node scripts/publish-issues.mjs --validate-only
      - name: Confirm the backlog index is current
        run: node scripts/publish-issues.mjs --validate-only --check-index

  contracts:
    # Observed ~345s: fmt, clippy over all targets, the unit tests, a release wasm build,
    # the size budgets and a coverage run. This is the one job that genuinely needs a
    # generous budget, so it gets one with room for a cold dependency cache.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
     
      # Pinned to the toolchain contracts/rust-toolchain.toml declares, rather than
      # `stable`. That file makes rustup resolve the compiler for anything run under
      # contracts/, so installing `stable` here tested a toolchain the repository does not
      # use and left the real one to be fetched mid-run.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            contracts/fuzz
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: contracts
      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: contracts
      - name: Run unit tests
        run: cargo test -- --test-threads=1
        working-directory: contracts

      # Runs here rather than in supply-chain-audit because it needs the cargo registry, which
      # only exists once something has fetched. With it, the licence allowlist in
      # dependency-review.yml is validated against the licences the crates actually declare —
      # including the `Apache-2.0 WITH LLVM-exception` and `Unicode-3.0` expressions that no
      # hand-written list would have predicted. Node is already on the runner; the script has no
      # dependencies and needs no install.
      - name: Check the licence policy covers the Rust dependency tree
        run: node scripts/check-dependency-review-scope.mjs --cargo-registry "${CARGO_HOME:-$HOME/.cargo}/registry/src"

      - name: Build WASM contracts
        run: cargo build --workspace --target wasm32v1-none --release --exclude zizalend-integration-tests
        working-directory: contracts

      # Per-contract budgets, with the reasoning for each recorded beside it. This replaced a
      # flat 256 KiB placeholder that every contract cleared with ~60% to spare, so it could not
      # fail and therefore enforced nothing.
      - name: Check WASM size budgets
        run: node scripts/check-wasm-size.mjs
      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: contracts/target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
      - name: Install tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      # `--fail-under 75` is what makes this a check rather than a report. Coverage was already
      # being measured and uploaded as an artifact, which means nothing could ever fail because
      # of it — a number nobody is held to is a number that drifts. Measured with the same tool
      # and the same invocation used here, so the threshold is one the suite actually clears
      # rather than a target chosen to look ambitious.
      - name: Run coverage
        run: cargo tarpaulin --out Xml --fail-under 75
        working-directory: contracts
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: contracts/cobertura.xml
          flags: contracts
          fail_ci_if_error: false
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage
          path: contracts/cobertura.xml
          retention-days: 7
      - name: Check fuzz targets compile
        run: cargo check
        working-directory: contracts/fuzz

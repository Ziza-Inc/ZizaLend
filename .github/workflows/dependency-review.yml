name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  # The review is computed from the pull request's own diff, so a superseded run's verdict is
  # about a revision nobody is looking at any more. There is no default-branch run to protect.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # Observed ~15s. The action compares manifests in the pull request diff; the budget covers
    # a cold API and its retry-on-snapshot-warnings behaviour.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          deny-licenses: |
            AGPL-1.0, AGPL-3.0, BSD-4-Clause, CC-BY-NC-1.0, CC-BY-NC-2.0,
            CC-BY-NC-2.5, CC-BY-NC-3.0, CC-BY-NC-4.0, OSL-1.0, OSL-1.1,
            OSL-2.0, OSL-2.1, OSL-3.0, SSPL-1.0

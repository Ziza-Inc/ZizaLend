name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  # Superseded pull-request analyses are cancelled, but a run on the default branch is not:
  # the weekly scheduled scan and a push scan would otherwise cancel each other, and a
  # cancelled analysis reports no security result at all.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The rust leg compiles the whole Soroban workspace before CodeQL can analyse it, so this
    # is the most expensive job in the repository. It is worth a long budget: CodeQL failing on
    # a timeout tells you nothing about the code.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild JS/TS
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@v4

      # Same pin as ci.yml, matching contracts/rust-toolchain.toml.
      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: wasm32v1-none

      - name: Build Soroban contracts workspace
        if: matrix.language == 'rust'
        working-directory: contracts
        run: cargo build --workspace --target wasm32v1-none --exclude zizalend-integration-tests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

name: Deploy Frontend

# Automatic deployment of the Next.js frontend.
#
# Two things are worth knowing about how this is wired.
#
# **Why Actions and not Vercel's Git integration.** Vercel can deploy straight from GitHub,
# but that requires the Vercel GitHub App to be installed on the `Ziza-Inc` organisation,
# which needs an org owner to complete an interactive OAuth consent. This workflow reaches
# the same end — a production deployment on every push to `main`, with the deployment URL
# recorded on the commit — without that out-of-band step. If the App is installed later,
# both mechanisms coexist harmlessly; this one stays authoritative for production.
#
# **Why the build is verified before it is deployed.** A green Vercel build is not evidence
# that the app works: `next build` succeeds on code with a broken route or an unresolved
# import so long as the failure is not reached at build time. Typecheck and lint run first,
# so a deployment can never publish a revision that would have failed the same checks in CI.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Vercel target"
        required: true
        default: production
        type: choice
        options: [production, preview]

concurrency:
  # One production deployment at a time, and never cancel one mid-flight: a cancelled deploy
  # can leave the alias pointing at a partially promoted build.
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: ${{ github.event.inputs.environment == 'preview' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.event.inputs.environment == 'preview' && 'preview' || 'production' }} \
            --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build deployment artifact
        run: vercel build ${{ github.event.inputs.environment != 'preview' && '--prod' || '' }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt \
            ${{ github.event.inputs.environment != 'preview' && '--prod' || '' }} \
            --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify the deployment serves
        env:
          # The URL a user actually reaches. Overridable so the alias can change without a
          # code edit, but defaulted, because a check that silently skips itself when a
          # variable is missing is not a check.
          PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL || 'https://zizalend.vercel.app' }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          # Two URLs, two different questions, and conflating them is what made this step lie.
          #
          # The *deployment* URL that `vercel deploy` prints is behind Vercel Deployment
          # Protection on this project: every request 302s to `vercel.com/sso-api`, and
          # following that lands on the Vercel login page, which answers 200. So asserting
          # `200` on the deployment URL does not verify this application at all — it verifies
          # that Vercel's own login page is up. Worse, grepping that page for the project
          # name also matches, because the name survives inside the SSO `next=` query
          # parameter. A check built that way passes against a completely broken deploy.
          #
          # The *production alias* is public and is what the deploy is for, so that is the
          # URL pinned here.
          #
          # The assertion string comes from the landing page's own metadata rather than from
          # the project name, precisely because the project name is present in the SSO
          # redirect too. "Borderless P2P Lending" exists only in the served application.
          marker="Borderless P2P Lending"

          body=$(mktemp)
          out=$(curl -sSL -o "$body" -w '%{http_code}\n%{url_effective}' \
            --max-time 30 --max-redirs 5 --retry 5 --retry-delay 5 "$PRODUCTION_URL")
          code=$(printf '%s' "$out" | sed -n 1p)
          effective=$(printf '%s' "$out" | sed -n 2p)
          echo "$PRODUCTION_URL -> $code (final: $effective)"

          # The root is expected to redirect: `next-intl` runs a `localePrefix: "always"`
          # middleware, so `/` negotiates to `/en`. Redirects are followed so the pinned code
          # reflects the page finally served, and the check never asserts a status the
          # application is not supposed to return.
          test "$code" = "200"
          test -s "$body"

          # A redirect that ends on Vercel's own site means Deployment Protection or an
          # alias misconfiguration intercepted the request. That must fail, not pass.
          host=$(printf '%s' "$effective" | awk -F/ '{print $3}')
          case "$host" in
            vercel.com|*.vercel.com)
              echo "::error::$PRODUCTION_URL resolved to $effective — the check reached Vercel, not the application"
              exit 1
              ;;
          esac

          grep -q "$marker" "$body" || {
            echo "::error::$effective answered $code but did not serve the application (missing: $marker)"
            exit 1
          }
          echo "✓ $effective serves the application"

          # When a protection-bypass secret is configured the deployment URL can be checked
          # directly, which is the one thing the alias cannot prove: that *this* build, and
          # not an older promotion, is the one answering. Without the secret the deployment
          # URL is unreachable anonymously, and asserting it anyway is how the lie started.
          if [ -n "${BYPASS_SECRET:-}" ]; then
            bp=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 5 \
              -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
              "${{ steps.deploy.outputs.url }}/en")
            echo "${{ steps.deploy.outputs.url }}/en (bypass) -> $bp"
            test "$bp" = "200"
          else
            echo "No VERCEL_AUTOMATION_BYPASS_SECRET: the deployment URL is behind Deployment Protection."
            echo "Asserting the public production alias only; the alias is promoted to this build by --prod."
          fi

      - name: Summarise
        run: |
          {
            echo "### Frontend deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Target | ${{ github.event.inputs.environment == 'preview' && 'preview' || 'production' }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
